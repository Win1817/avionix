version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: avionix
      POSTGRES_USER: avionix
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./shared/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    ports: ["5432:5432"]
    networks: [avionix-net]

  postgres-keycloak:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KC_DB_PASSWORD}
    volumes: [keycloak_db:/var/lib/postgresql/data]
    networks: [avionix-net]

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports: ["6379:6379"]
    networks: [avionix-net]

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes: [zookeeper_data:/var/lib/zookeeper/data]
    networks: [avionix-net]

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    depends_on: [zookeeper]
    ports: ["9092:9092"]
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes: [kafka_data:/var/lib/kafka/data]
    networks: [avionix-net]

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    depends_on: [kafka]
    ports: ["8090:8080"]
    environment:
      KAFKA_CLUSTERS_0_NAME: avionix
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    networks: [avionix-net]

  keycloak:
    build: ./keycloak
    depends_on: [postgres-keycloak]
    environment:
      KC_DB_PASSWORD: ${KC_DB_PASSWORD}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HOSTNAME: ${KC_HOSTNAME:-localhost}
    ports: ["8080:8080"]
    networks: [avionix-net]

  api-gateway:
    build: ./api-gateway
    depends_on: [keycloak, fdps-service, snet-service]
    env_file: .env
    environment:
      GATEWAY_PORT: 4000
      KEYCLOAK_URL: http://keycloak:8080
      FDPS_URL: http://fdps-service:3001
      SNET_URL: http://snet-service:3002
      SURVEILLANCE_URL: http://surveillance-service:3003
      COORDINATION_URL: http://coordination-service:3004
      WEATHER_URL: http://weather-service:3005
      ANALYTICS_URL: http://analytics-service:3006
      ML_URL: http://ml-service:3007
    ports: ["4000:4000"]
    networks: [avionix-net]
    restart: unless-stopped

  data-ingest-service:
    build: ./data-ingest-service
    depends_on: [postgres, kafka, keycloak]
    env_file: .env
    environment:
      INGEST_PORT: 3008
      KAFKA_BROKERS: kafka:29092
      KEYCLOAK_URL: http://keycloak:8080
    ports: ["3008:3008"]
    networks: [avionix-net]
    restart: unless-stopped

  fdps-service:
    build: ./fdps-service
    depends_on: [postgres, keycloak]
    env_file: .env
    environment:
      FDPS_PORT: 3001
      KEYCLOAK_URL: http://keycloak:8080
    ports: ["3001:3001"]
    networks: [avionix-net]
    restart: unless-stopped

  snet-service:
    build: ./snet-service
    depends_on: [postgres, keycloak]
    env_file: .env
    environment:
      SNET_PORT: 3002
      KEYCLOAK_URL: http://keycloak:8080
    ports: ["3002:3002"]
    networks: [avionix-net]
    restart: unless-stopped

  surveillance-service:
    build: ./surveillance-service
    depends_on: [postgres, keycloak]
    env_file: .env
    environment:
      SURVEILLANCE_PORT: 3003
      KEYCLOAK_URL: http://keycloak:8080
    ports: ["3003:3003"]
    networks: [avionix-net]
    restart: unless-stopped

  coordination-service:
    build: ./coordination-service
    depends_on: [postgres, keycloak]
    env_file: .env
    environment:
      COORDINATION_PORT: 3004
      KEYCLOAK_URL: http://keycloak:8080
    ports: ["3004:3004"]
    networks: [avionix-net]
    restart: unless-stopped

  weather-service:
    build: ./weather-service
    depends_on: [postgres, keycloak]
    env_file: .env
    environment:
      WEATHER_PORT: 3005
      KEYCLOAK_URL: http://keycloak:8080
    ports: ["3005:3005"]
    networks: [avionix-net]
    restart: unless-stopped

  analytics-service:
    build: ./analytics-service
    depends_on: [postgres, keycloak]
    env_file: .env
    environment:
      ANALYTICS_PORT: 3006
      KEYCLOAK_URL: http://keycloak:8080
    ports: ["3006:3006"]
    networks: [avionix-net]
    restart: unless-stopped

  ml-service:
    build: ./ml-service
    depends_on: [postgres, keycloak]
    env_file: .env
    environment:
      ML_PORT: 3007
      KEYCLOAK_URL: http://keycloak:8080
    ports: ["3007:3007"]
    networks: [avionix-net]
    restart: unless-stopped

  frontend:
    build: ./frontend
    depends_on: [api-gateway]
    environment:
      VITE_API_URL: http://localhost:4000/api
      VITE_WS_URL: ws://localhost:4000/ws
      VITE_KEYCLOAK_URL: http://localhost:8080
      VITE_KEYCLOAK_REALM: avionix
      VITE_KEYCLOAK_CLIENT_ID: avionix-frontend
    ports: ["5173:80"]
    networks: [avionix-net]

  prometheus:
    image: prom/prometheus:latest
    volumes: [prometheus_data:/prometheus]
    ports: ["9090:9090"]
    networks: [avionix-net]

  grafana:
    image: grafana/grafana:latest
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
    volumes: [grafana_data:/var/lib/grafana]
    ports: ["3000:3000"]
    networks: [avionix-net]

volumes:
  postgres_data:
  keycloak_db:
  kafka_data:
  zookeeper_data:
  prometheus_data:
  grafana_data:

networks:
  avionix-net:
    driver: bridge
