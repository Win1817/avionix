services:
  # ─── INFRASTRUCTURE ──────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: avionix
      POSTGRES_USER: avionix
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./shared/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U avionix"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [avionix-net]

  postgres-keycloak:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KC_DB_PASSWORD}
    volumes: [keycloak_db:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [avionix-net]

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports: ["6379:6379"]
    networks: [avionix-net]

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes: [zookeeper_data:/var/lib/zookeeper/data]
    networks: [avionix-net]

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    depends_on: [zookeeper]
    ports: ["9092:9092"]
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 24
      KAFKA_HEAP_OPTS: "-Xmx512m -Xms256m"
    volumes: [kafka_data:/var/lib/kafka/data]
    networks: [avionix-net]

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    depends_on: [kafka]
    ports: ["8090:8080"]
    environment:
      KAFKA_CLUSTERS_0_NAME: avionix
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    networks: [avionix-net]

  # ─── REVERSE PROXY ───────────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    depends_on: [keycloak, frontend, gateway-service]
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports: ["80:80"]
    networks: [avionix-net]
    restart: unless-stopped

  # ─── AUTH ────────────────────────────────────────────────────────────────────
  keycloak:
    build:
      context: .
      dockerfile: keycloak/Dockerfile
    depends_on:
      postgres-keycloak:
        condition: service_healthy
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres-keycloak:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KC_DB_PASSWORD}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HOSTNAME: phantomx.zapto.org
      KC_HOSTNAME_PORT: 80
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/8080 && echo -e \"GET /health/ready HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n\" >&3 && cat <&3 | grep -q UP'"]
      interval: 15s
      timeout: 10s
      start_period: 60s
      retries: 8
    networks: [avionix-net]

  # ─── MICROSERVICES — each builds independently from its own directory ─────────
  fdps-service:
    build:
      context: ./fdps-service        # self-contained Spring Boot app
      dockerfile: Dockerfile
    depends_on:
      postgres: { condition: service_healthy }
      keycloak: { condition: service_healthy }
    environment:
      DB_HOST: postgres
      DB_PASSWORD: ${DB_PASSWORD}
      KEYCLOAK_URL: http://keycloak:8080
      KAFKA_BROKERS: kafka:29092
    ports: ["3001:3001"]
    networks: [avionix-net]
    restart: unless-stopped

  snet-service:
    build:
      context: ./snet-service
      dockerfile: Dockerfile
    depends_on:
      postgres: { condition: service_healthy }
      keycloak: { condition: service_healthy }
    environment:
      DB_HOST: postgres
      DB_PASSWORD: ${DB_PASSWORD}
      KEYCLOAK_URL: http://keycloak:8080
      KAFKA_BROKERS: kafka:29092
    ports: ["3002:3002"]
    networks: [avionix-net]
    restart: unless-stopped

  surveillance-service:
    build:
      context: ./surveillance-service
      dockerfile: Dockerfile
    depends_on:
      postgres: { condition: service_healthy }
      keycloak: { condition: service_healthy }
    environment:
      DB_HOST: postgres
      DB_PASSWORD: ${DB_PASSWORD}
      KEYCLOAK_URL: http://keycloak:8080
      KAFKA_BROKERS: kafka:29092
    ports: ["3003:3003"]
    networks: [avionix-net]
    restart: unless-stopped

  coordination-service:
    build:
      context: ./coordination-service
      dockerfile: Dockerfile
    depends_on:
      postgres: { condition: service_healthy }
      keycloak: { condition: service_healthy }
    environment:
      DB_HOST: postgres
      DB_PASSWORD: ${DB_PASSWORD}
      KEYCLOAK_URL: http://keycloak:8080
    ports: ["3004:3004"]
    networks: [avionix-net]
    restart: unless-stopped

  weather-service:
    build:
      context: ./weather-service
      dockerfile: Dockerfile
    depends_on:
      postgres: { condition: service_healthy }
      keycloak: { condition: service_healthy }
    environment:
      DB_HOST: postgres
      DB_PASSWORD: ${DB_PASSWORD}
      KEYCLOAK_URL: http://keycloak:8080
    ports: ["3005:3005"]
    networks: [avionix-net]
    restart: unless-stopped

  analytics-service:
    build:
      context: ./analytics-service
      dockerfile: Dockerfile
    depends_on:
      postgres: { condition: service_healthy }
      keycloak: { condition: service_healthy }
    environment:
      DB_HOST: postgres
      DB_PASSWORD: ${DB_PASSWORD}
      KEYCLOAK_URL: http://keycloak:8080
    ports: ["3006:3006"]
    networks: [avionix-net]
    restart: unless-stopped

  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    depends_on:
      postgres: { condition: service_healthy }
      keycloak: { condition: service_healthy }
    environment:
      DB_HOST: postgres
      DB_PASSWORD: ${DB_PASSWORD}
      KEYCLOAK_URL: http://keycloak:8080
    ports: ["3007:3007"]
    networks: [avionix-net]
    restart: unless-stopped

  ingest-service:
    build:
      context: ./ingest-service
      dockerfile: Dockerfile
    depends_on:
      postgres: { condition: service_healthy }
      keycloak: { condition: service_healthy }
    environment:
      DB_HOST: postgres
      DB_PASSWORD: ${DB_PASSWORD}
      KEYCLOAK_URL: http://keycloak:8080
      KAFKA_BROKERS: kafka:29092
    ports: ["3008:3008"]
    networks: [avionix-net]
    restart: unless-stopped

  gateway-service:
    build:
      context: ./gateway-service
      dockerfile: Dockerfile
    depends_on:
      keycloak: { condition: service_healthy }
    environment:
      KEYCLOAK_URL: http://keycloak:8080
      FDPS_HOST: fdps-service
      SNET_HOST: snet-service
      SURVEILLANCE_HOST: surveillance-service
      COORDINATION_HOST: coordination-service
      WEATHER_HOST: weather-service
      ANALYTICS_HOST: analytics-service
      ML_HOST: ml-service
      INGEST_HOST: ingest-service
    ports: ["4000:4000"]
    networks: [avionix-net]
    restart: unless-stopped

  # ─── FRONTEND ────────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on: [gateway-service]
    environment:
      VITE_API_URL: http://phantomx.zapto.org/api
      VITE_WS_URL: ws://phantomx.zapto.org/ws
      VITE_KEYCLOAK_URL: http://phantomx.zapto.org
      VITE_KEYCLOAK_REALM: avionix
      VITE_KEYCLOAK_CLIENT_ID: avionix-frontend
    networks: [avionix-net]

  # ─── SIMULATOR (opt-in: docker compose --profile simulator up) ───────────────
  simulator-service:
    build:
      context: ./simulator-service
      dockerfile: Dockerfile
    depends_on: [gateway-service, ingest-service]
    environment:
      SIM_PORT: 3009
      INGEST_URL: http://ingest-service:3008/api/ingest
      GATEWAY_URL: http://gateway-service:4000
      FLIGHT_COUNT: ${SIM_FLIGHT_COUNT:-20}
      POSITION_INTERVAL_MS: ${SIM_POSITION_INTERVAL_MS:-4000}
      AUTO_START: ${SIM_AUTO_START:-false}
    ports: ["3009:3009"]
    networks: [avionix-net]
    restart: unless-stopped
    profiles: ["simulator"]

  # ─── MONITORING ──────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports: ["9090:9090"]
    networks: [avionix-net]

  grafana:
    image: grafana/grafana:latest
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
    volumes: [grafana_data:/var/lib/grafana]
    ports: ["3000:3000"]
    networks: [avionix-net]

volumes:
  postgres_data:
  keycloak_db:
  kafka_data:
  zookeeper_data:
  prometheus_data:
  grafana_data:

networks:
  avionix-net:
    driver: bridge
