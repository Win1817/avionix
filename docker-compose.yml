version: '3.9'

services:
  # ─── INFRASTRUCTURE ──────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: avionix
      POSTGRES_USER: avionix
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./shared/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U avionix"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [avionix-net]

  postgres-keycloak:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KC_DB_PASSWORD}
    volumes: [keycloak_db:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [avionix-net]

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [avionix-net]

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_LOG4J_ROOT_LOGLEVEL: WARN
    volumes: [zookeeper_data:/var/lib/zookeeper/data]
    networks: [avionix-net]

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    depends_on: [zookeeper]
    ports: ["9092:9092"]
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 24
      KAFKA_HEAP_OPTS: "-Xmx512m -Xms256m"
      KAFKA_LOG4J_ROOT_LOGLEVEL: WARN
    volumes: [kafka_data:/var/lib/kafka/data]
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list > /dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks: [avionix-net]

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    depends_on: [kafka]
    ports: ["8090:8080"]
    environment:
      KAFKA_CLUSTERS_0_NAME: avionix
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    networks: [avionix-net]

  # ─── AUTH ────────────────────────────────────────────────────────────────────
  keycloak:
    build:
      context: .
      dockerfile: keycloak/Dockerfile
    depends_on:
      postgres-keycloak:
        condition: service_healthy
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres-keycloak:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KC_DB_PASSWORD}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HOSTNAME: ${KC_HOSTNAME:-localhost}
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      KC_LOG_LEVEL: WARN
    ports: ["8080:8080"]
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health/ready || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 90s
    networks: [avionix-net]

  # ─── CORE ENTRY POINTS ───────────────────────────────────────────────────────
  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    depends_on:
      keycloak:
        condition: service_healthy
    env_file: .env
    environment:
      GATEWAY_PORT: 4000
      KEYCLOAK_URL: http://keycloak:8080
      FDPS_URL: http://fdps-service:3001
      SNET_URL: http://snet-service:3002
      SURVEILLANCE_URL: http://surveillance-service:3003
      COORDINATION_URL: http://coordination-service:3004
      WEATHER_URL: http://weather-service:3005
      ANALYTICS_URL: http://analytics-service:3006
      ML_URL: http://ml-service:3007
    ports: ["4000:4000"]
    networks: [avionix-net]
    restart: unless-stopped

  data-ingest-service:
    build:
      context: .
      dockerfile: data-ingest-service/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    env_file: .env
    environment:
      INGEST_PORT: 3008
      KAFKA_BROKERS: kafka:29092
      KEYCLOAK_URL: http://keycloak:8080
    ports: ["3008:3008"]
    networks: [avionix-net]
    restart: unless-stopped

  # ─── AVIONIX SERVICES ────────────────────────────────────────────────────────
  fdps-service:
    build:
      context: .
      dockerfile: fdps-service/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    env_file: .env
    environment:
      FDPS_PORT: 3001
      KEYCLOAK_URL: http://keycloak:8080
    ports: ["3001:3001"]
    networks: [avionix-net]
    restart: unless-stopped

  snet-service:
    build:
      context: .
      dockerfile: snet-service/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    env_file: .env
    environment:
      SNET_PORT: 3002
      KEYCLOAK_URL: http://keycloak:8080
    ports: ["3002:3002"]
    networks: [avionix-net]
    restart: unless-stopped

  surveillance-service:
    build:
      context: .
      dockerfile: surveillance-service/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    env_file: .env
    environment:
      SURVEILLANCE_PORT: 3003
      KEYCLOAK_URL: http://keycloak:8080
    ports: ["3003:3003"]
    networks: [avionix-net]
    restart: unless-stopped

  coordination-service:
    build:
      context: .
      dockerfile: coordination-service/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    env_file: .env
    environment:
      COORDINATION_PORT: 3004
      KEYCLOAK_URL: http://keycloak:8080
    ports: ["3004:3004"]
    networks: [avionix-net]
    restart: unless-stopped

  weather-service:
    build:
      context: .
      dockerfile: weather-service/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    env_file: .env
    environment:
      WEATHER_PORT: 3005
      KEYCLOAK_URL: http://keycloak:8080
    ports: ["3005:3005"]
    networks: [avionix-net]
    restart: unless-stopped

  analytics-service:
    build:
      context: .
      dockerfile: analytics-service/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    env_file: .env
    environment:
      ANALYTICS_PORT: 3006
      KEYCLOAK_URL: http://keycloak:8080
    ports: ["3006:3006"]
    networks: [avionix-net]
    restart: unless-stopped

  ml-service:
    build:
      context: .
      dockerfile: ml-service/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    env_file: .env
    environment:
      ML_PORT: 3007
      KEYCLOAK_URL: http://keycloak:8080
    ports: ["3007:3007"]
    networks: [avionix-net]
    restart: unless-stopped

  # ─── FRONTEND ────────────────────────────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on: [api-gateway]
    environment:
      VITE_API_URL: http://localhost:4000/api
      VITE_WS_URL: ws://localhost:4000/ws
      VITE_KEYCLOAK_URL: http://localhost:8080
      VITE_KEYCLOAK_REALM: avionix
      VITE_KEYCLOAK_CLIENT_ID: avionix-frontend
    ports: ["5173:80"]
    networks: [avionix-net]

  # ─── MONITORING ──────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports: ["9090:9090"]
    networks: [avionix-net]

  grafana:
    image: grafana/grafana:latest
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_LOG_LEVEL: warn
    volumes: [grafana_data:/var/lib/grafana]
    ports: ["3000:3000"]
    networks: [avionix-net]

  # ─── SIMULATOR (opt-in: docker compose --profile simulator up) ───────────────
  simulator-service:
    build:
      context: .
      dockerfile: simulator-service/Dockerfile
    depends_on: [api-gateway, data-ingest-service]
    environment:
      SIM_PORT: 3009
      INGEST_URL: http://data-ingest-service:3008
      FDPS_URL: http://fdps-service:3001
      WEATHER_URL: http://weather-service:3005
      GATEWAY_URL: http://api-gateway:4000
      FLIGHT_COUNT: ${SIM_FLIGHT_COUNT:-20}
      POSITION_INTERVAL_MS: ${SIM_POSITION_INTERVAL_MS:-4000}
      AUTO_START: ${SIM_AUTO_START:-false}
    ports: ["3009:3009"]
    networks: [avionix-net]
    restart: unless-stopped
    profiles: ["simulator"]

volumes:
  postgres_data:
  keycloak_db:
  kafka_data:
  zookeeper_data:
  prometheus_data:
  grafana_data:

networks:
  avionix-net:
    driver: bridge
