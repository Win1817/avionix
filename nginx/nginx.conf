upstream keycloak        { server keycloak:8080; }
upstream cwp-service     { server cwp-service:80; }
upstream gateway         { server gateway-service:4000; }
upstream fdps            { server fdps-service:3001; }
upstream snet            { server snet-service:3002; }
upstream surveillance    { server surveillance-service:3003; }
upstream coordination    { server coordination-service:3004; }
upstream weather         { server weather-service:3005; }
upstream analytics       { server analytics-service:3006; }
upstream ml              { server ml-service:3007; }
upstream ingest          { server ingest-service:3008; }

server {
    listen 80;
    server_name phantomx.zapto.org;

    large_client_header_buffers 8 32k;
    proxy_buffer_size          128k;
    proxy_buffers              4 256k;
    proxy_busy_buffers_size    256k;

    # ─── Keycloak ─────────────────────────────────────────────────────────────
    location ~* ^/(admin|realms|resources|js|welcome|health|metrics)(/|$) {
        proxy_pass        http://keycloak;
        proxy_set_header  Host              $host;
        proxy_set_header  X-Real-IP         $remote_addr;
        proxy_set_header  X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header  X-Forwarded-Proto $scheme;
        proxy_set_header  X-Forwarded-Host  $host;
        proxy_set_header  X-Forwarded-Port  80;
        proxy_read_timeout 90;
    }

    # ─── Microservices ────────────────────────────────────────────────────────
    location /fdps-service/ {
        proxy_pass        http://fdps/fdps-service/;
        proxy_set_header  Host              $host;
        proxy_set_header  X-Real-IP         $remote_addr;
        proxy_set_header  X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header  X-Forwarded-Proto $scheme;
        proxy_read_timeout 90;
    }

    location /snet-service/ {
        proxy_pass        http://snet/snet-service/;
        proxy_set_header  Host              $host;
        proxy_set_header  X-Real-IP         $remote_addr;
        proxy_set_header  X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header  X-Forwarded-Proto $scheme;
        proxy_read_timeout 90;
    }

    location /surveillance-service/ {
        proxy_pass        http://surveillance/surveillance-service/;
        proxy_set_header  Host              $host;
        proxy_set_header  X-Real-IP         $remote_addr;
        proxy_set_header  X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header  X-Forwarded-Proto $scheme;
        proxy_read_timeout 90;
    }

    location /coordination-service/ {
        proxy_pass        http://coordination/coordination-service/;
        proxy_set_header  Host              $host;
        proxy_set_header  X-Real-IP         $remote_addr;
        proxy_set_header  X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header  X-Forwarded-Proto $scheme;
        proxy_read_timeout 90;
    }

    location /weather-service/ {
        proxy_pass        http://weather/weather-service/;
        proxy_set_header  Host              $host;
        proxy_set_header  X-Real-IP         $remote_addr;
        proxy_set_header  X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header  X-Forwarded-Proto $scheme;
        proxy_read_timeout 90;
    }

    location /analytics-service/ {
        proxy_pass        http://analytics/analytics-service/;
        proxy_set_header  Host              $host;
        proxy_set_header  X-Real-IP         $remote_addr;
        proxy_set_header  X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header  X-Forwarded-Proto $scheme;
        proxy_read_timeout 90;
    }

    location /ml-service/ {
        proxy_pass        http://ml/ml-service/;
        proxy_set_header  Host              $host;
        proxy_set_header  X-Real-IP         $remote_addr;
        proxy_set_header  X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header  X-Forwarded-Proto $scheme;
        proxy_read_timeout 90;
    }

    location /ingest-service/ {
        proxy_pass        http://ingest/ingest-service/;
        proxy_set_header  Host              $host;
        proxy_set_header  X-Real-IP         $remote_addr;
        proxy_set_header  X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header  X-Forwarded-Proto $scheme;
        proxy_read_timeout 90;
    }

    # ─── API Gateway — WebSocket ──────────────────────────────────────────────
    location /ws {
        proxy_pass         http://gateway;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_read_timeout 3600;
    }

    # ─── CWP — Controller Working Position dashboard ──────────────────────────
    location /cwp {
        proxy_pass        http://cwp-service;
        proxy_set_header  Host              $host;
        proxy_set_header  X-Real-IP         $remote_addr;
        proxy_set_header  X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header  X-Forwarded-Proto $scheme;
        proxy_read_timeout 90;
    }

    # Redirect root to /cwp
    location = / {
        return 301 /cwp;
    }
}
