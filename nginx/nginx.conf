upstream keycloak {
    server keycloak:8080;
}

upstream frontend {
    server frontend:80;
}

upstream gateway {
    server gateway-service:4000;
}

server {
    listen 80;
    server_name phantomx.zapto.org;

    # Allow large headers for Keycloak tokens
    large_client_header_buffers 8 32k;
    proxy_buffer_size          128k;
    proxy_buffers              4 256k;
    proxy_busy_buffers_size    256k;

    # ─── Keycloak — admin console, realms, resources, js adapters ────────────
    location ~* ^/(admin|realms|resources|js|welcome|health|metrics)(/|$) {
        proxy_pass         http://keycloak;
        proxy_set_header   Host               $host;
        proxy_set_header   X-Real-IP          $remote_addr;
        proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto  $scheme;
        proxy_set_header   X-Forwarded-Host   $host;
        proxy_set_header   X-Forwarded-Port   80;
        proxy_read_timeout 90;
    }

    # ─── API gateway — REST API ───────────────────────────────────────────────
    location /api/ {
        proxy_pass         http://gateway;
        proxy_set_header   Host               $host;
        proxy_set_header   X-Real-IP          $remote_addr;
        proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto  $scheme;
        proxy_read_timeout 90;
    }

    # ─── API gateway — WebSocket ──────────────────────────────────────────────
    location /ws {
        proxy_pass         http://gateway;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade            $http_upgrade;
        proxy_set_header   Connection         "upgrade";
        proxy_set_header   Host               $host;
        proxy_set_header   X-Real-IP          $remote_addr;
        proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600;
    }

    # ─── Frontend — CWP dashboard (catch-all) ────────────────────────────────
    location / {
        proxy_pass         http://frontend;
        proxy_set_header   Host               $host;
        proxy_set_header   X-Real-IP          $remote_addr;
        proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto  $scheme;
        proxy_read_timeout 90;
    }
}
